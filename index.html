<script>
(function(){
  const APP_URL = "https://script.google.com/macros/s/AKfycbxhCKJHXlOE_3R0zD30B_EXg78DsKFKI0pQQ9dfnyYkAm7iNy5lERseqr_Wn6_az0fJ5A/exec";

  // إذا انفتح من الأيقونة على الشاشة الرئيسية
  if (window.navigator.standalone === true) {
    setTimeout(function(){
      window.location.replace(APP_URL);
    }, 150);
    return;
  }

  // إذا انفتح من Safari للتثبيت
  document.getElementById("setupBox").style.display = "none";
  document.getElementById("savedBox").style.display = "block";

  document.getElementById("savedBox").innerHTML = `
    <div class="msg">
      SUPPORT جاهز للتثبيت ✅<br>
      من Safari اضغط مشاركة ثم Add to Home Screen.
    </div>
    <button type="button" onclick="window.location.href='${APP_URL}'">
      فتح SUPPORT
    </button>
  `;
})();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
