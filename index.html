<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0c2238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SUPPORT">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SUPPORT</title>

  <link rel="apple-touch-icon" sizes="180x180" href="SUPPORT_icon_180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="SUPPORT_icon_512_launcher.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      min-height:100%;
      background:#0c2238;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      overflow:hidden;
    }
    body{min-height:100vh;min-height:100dvh;color:#fff}

    #installView{
      min-height:100vh;min-height:100dvh;
      display:grid;place-items:center;
      padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
      background:#0c2238;
    }
    .card{
      width:min(420px,100%);background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.13);border-radius:28px;
      padding:30px 28px;box-shadow:0 24px 70px rgba(0,0,0,.28);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);text-align:center;
    }
    .logo{width:118px;height:118px;object-fit:cover;border-radius:28px;display:block;margin:0 auto 18px;box-shadow:0 16px 35px rgba(0,0,0,.25)}
    h1{margin:0;font-size:32px;letter-spacing:1.5px;font-weight:900}
    .sub{margin:7px 0 25px;color:#b8c7d8;font-size:13px}
    .msg{margin:0;padding:18px 12px;color:#d3deea;font-size:14px;line-height:1.9}
    .open-btn{width:100%;min-height:52px;border:0;border-radius:15px;margin-top:14px;padding:0 18px;background:#fff;color:#0c2238;font-size:15px;font-weight:900;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .hint{margin-top:14px;color:#91a4b9;font-size:11px;line-height:1.7}

    /* Installed app: the iframe itself fills the whole PWA viewport.
       Do not reserve a second safe-area below it; iOS already owns that area. */
    #appShell{
      display:none;
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      min-height:100dvh;
      background:#0c2238;
      overflow:hidden;
    }

    #supportFrame{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      min-height:100%;
      border:0;
      margin:0;
      padding:0;
      display:block;
      background:#f5f7fa;
    }

    #splash{
      position:absolute;
      inset:0;
      z-index:30;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
      background:radial-gradient(circle at 50% 22%,rgba(66,139,226,.24),transparent 32%),linear-gradient(160deg,#061426,#0a2340 60%,#0c2f54);
      transition:opacity .25s ease,visibility .25s ease;
    }
    #splash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .splash-logo{width:116px;height:116px;border-radius:28px;object-fit:cover;box-shadow:0 20px 55px rgba(0,0,0,.34)}
    .splash-title{font-size:28px;font-weight:900;letter-spacing:.8px}
    .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    body.app-mode{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      margin:0;
      background:#0c2238;
      overflow:hidden;
      overscroll-behavior:none;
    }
    body.app-mode #installView{display:none}
    body.app-mode #appShell{display:block}
  </style>
</head>
<body>
  <section id="installView">
    <main class="card">
      <img class="logo" src="SUPPORT_icon_180.png" alt="SUPPORT">
      <h1>SUPPORT</h1>
      <div class="sub">Kuwait Fire Force · Technical Systems</div>
      <div class="msg">
        SUPPORT جاهز للتثبيت ✅<br>
        من Safari اضغط مشاركة ثم <b>Add to Home Screen</b>.
      </div>
      <button class="open-btn" type="button" onclick="openSupportInSafari()">فتح SUPPORT</button>
      <div class="hint">ثبّت هذه الصفحة على الشاشة الرئيسية حتى يظهر شعار SUPPORT ويفتح بدون شريط Safari.</div>
    </main>
  </section>

  <section id="appShell" aria-hidden="true">
    <iframe
      id="supportFrame"
      title="SUPPORT"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
      src="about:blank"
    ></iframe>

    <div id="splash">
      <img class="splash-logo" src="SUPPORT_icon_180.png" alt="SUPPORT">
      <div class="splash-title">SUPPORT</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </section>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbxhCKJHXlOE_3R0zD30B_EXg78DsKFKI0pQQ9dfnyYkAm7iNy5lERseqr_Wn6_az0fJ5A/exec";

    function isStandalone(){
      return window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    }

    function openSupportInSafari(){
      window.location.href = APP_URL;
    }

    function startInstalledApp(){
      document.body.classList.add("app-mode");
      const shell = document.getElementById("appShell");
      const frame = document.getElementById("supportFrame");
      const splash = document.getElementById("splash");
      shell.setAttribute("aria-hidden","false");

      frame.addEventListener("load",function(){
        setTimeout(function(){ splash.classList.add("hide"); },350);
      },{once:true});

      frame.src = APP_URL;

      setTimeout(function(){
        splash.classList.add("hide");
      },5000);
    }

    if(isStandalone()){
      startInstalledApp();
    }

    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("./sw.js?v=8").catch(function(error){
        console.log("Service Worker:",error);
      });
    }
  </script>
</body>
</html>
