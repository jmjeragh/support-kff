<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0c2238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SUPPORT">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SUPPORT</title>

  <link rel="apple-touch-icon" sizes="180x180" href="SUPPORT_icon_180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="SUPPORT_icon_512_launcher.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0c2238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff}
    .card{width:min(420px,100%);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
      border-radius:28px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.28);backdrop-filter:blur(16px)}
    .logo{width:110px;height:110px;border-radius:26px;display:block;margin:0 auto 16px;box-shadow:0 16px 35px rgba(0,0,0,.25)}
    h1{margin:0;text-align:center;font-size:31px;letter-spacing:1px}
    .sub{text-align:center;margin:6px 0 24px;color:#b8c7d8;font-size:13px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
    input{width:100%;min-height:50px;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:0 14px;
      background:rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none;direction:ltr;text-align:left}
    input::placeholder{color:#7f93a9}
    button{width:100%;min-height:50px;border:0;border-radius:14px;margin-top:12px;background:#fff;color:#0c2238;
      font-size:15px;font-weight:900;cursor:pointer}
    .secondary{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.14)}
    .msg{margin-top:14px;text-align:center;line-height:1.7;font-size:13px;color:#c7d4e1}
    .error{color:#ffd2d2}
    #savedBox{display:none}
    .small{font-size:11px;color:#91a4b9;margin-top:14px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="SUPPORT_icon_180.png" alt="SUPPORT">
    <h1>SUPPORT</h1>
    <div class="sub">Kuwait Fire Force · Technical Systems</div>

    <section id="setupBox">
      <label for="appUrl">رابط موقع SUPPORT الحالي</label>
      <input id="appUrl" type="url" inputmode="url" autocomplete="off"
             placeholder="https://script.google.com/macros/s/....../exec">
      <button type="button" onclick="saveUrl()">حفظ الرابط</button>
      <div id="msg" class="msg">الصق رابط الـ Web App الحالي مرة واحدة فقط.</div>
    </section>

    <section id="savedBox">
      <div class="msg">تم حفظ رابط النظام ✅<br>الحين أضف هذه الصفحة إلى الشاشة الرئيسية باسم <b>SUPPORT</b>.</div>
      <button type="button" onclick="openApp()">فتح SUPPORT</button>
      <button class="secondary" type="button" onclick="editUrl()">تغيير رابط النظام</button>
      <div class="small">بعد إضافتها للشاشة الرئيسية، الضغط على الأيقونة يفتح نظامك الحالي.</div>
    </section>
  </main>

<script>
(function(){
  const saved = localStorage.getItem("supportAppUrl");
  if(saved){
    document.getElementById("appUrl").value = saved;
    document.getElementById("setupBox").style.display = "none";
    document.getElementById("savedBox").style.display = "block";

    // No automatic redirect: keeps this launcher page active so iOS installs
    // the GitHub PWA with the SUPPORT icon. Use the Open SUPPORT button manually.
  }
})();

function validAppsScriptUrl(url){
  return /^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec(?:\?.*)?$/i.test(url);
}

function saveUrl(){
  const input = document.getElementById("appUrl");
  const msg = document.getElementById("msg");
  const url = (input.value || "").trim();

  if(!validAppsScriptUrl(url)){
    msg.className = "msg error";
    msg.textContent = "حط رابط النشر الذي ينتهي بـ /exec.";
    return;
  }

  localStorage.setItem("supportAppUrl", url);
  document.getElementById("setupBox").style.display = "none";
  document.getElementById("savedBox").style.display = "block";
}

function openApp(){
  const url = localStorage.getItem("supportAppUrl");
  if(url) location.href = url;
}

function editUrl(){
  document.getElementById("savedBox").style.display = "none";
  document.getElementById("setupBox").style.display = "block";
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</body>
</html>
